name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Check tag matches every crate and npm version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | join(" ")')
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match crate versions $version"; exit 1 ;;
          esac
          npm_version=$(jq -r .version npm/package.json)
          if [ "$npm_version" != "$version" ]; then
            echo "::error::npm/package.json version $npm_version does not match crate versions $version"
            exit 1
          fi
      - name: Test
        run: cargo test --workspace --locked
      - name: Package crates
        run: cargo package --workspace --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --workspace --bins --target "$TARGET"
      - name: Package
        run: |
          name="arkade-compiler-$GITHUB_REF_NAME-$TARGET"
          ext=""
          [[ "$TARGET" == *windows* ]] && ext=.exe
          mkdir "$name"
          cp README.md LICENSE "target/$TARGET/release/arkadec$ext" "target/$TARGET/release/arkade-bindgen$ext" "$name/"
          # x86_64-apple-darwin is cross-compiled on an arm64 runner and is not executed.
          if [[ "$TARGET" != x86_64-apple-darwin ]]; then
            "$name/arkadec$ext" --version
            "$name/arkade-bindgen$ext" --version
          fi
          if [[ "$TARGET" == *windows* ]]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  npm-package:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: wasm-pack@0.15.0
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: npm/*.tgz

  release:
    needs: [build, npm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum * > SHA256SUMS
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=--prerelease
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease *

  publish:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in arkade-compiler arkade-bindgen; do
            if curl -sfA "arkade-os/compiler release" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already published"
            else
              cargo publish --locked -p "$crate"
            fi
          done

  # The first publish of a package name is manual; trusted publishing needs the package to exist.
  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install an npm with trusted publishing
        run: npm install -g npm@11.6.2
      - name: Publish package
        run: |
          package=$(ls arkade-os-compiler-*.tgz)
          version=$(tar -xOzf "$package" package/package.json | jq -r .version)
          # A suffixed test tag, such as v0.1.0-test for version 0.1.0, publishes nothing.
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "$GITHUB_REF_NAME is not v$version; not publishing"
            exit 0
          fi
          if npm view "@arkade-os/compiler@$version" version > /dev/null 2>&1; then
            echo "@arkade-os/compiler $version is already published"
            exit 0
          fi
          tag=latest
          [[ "$version" == *-* ]] && tag=next
          npm publish "$package" --tag "$tag" --access public
