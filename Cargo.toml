[workspace]
members = [".", "arkade-bindgen"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["tiero", "msinkec", "d4rp4t"]
license = "MIT"
repository = "https://github.com/arkade-os/compiler"

[package]
name = "arkade-compiler"
version.workspace = true
edition.workspace = true
description = "A compiler for Arkade Script - a language for creating Bitcoin Taproot scripts"
authors.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**/*.rs", "src/**/*.pest", "LICENSE"]

[dependencies]
pest = "2.7.8"
pest_derive = "2.7.8"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
clap = { version = "4.5.3", features = ["derive"] }
chrono = "0.4.34"
sha2 = "0.10.9"

# WASM support (optional, for web playground)
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
wasm = ["wasm-bindgen", "console_error_panic_hook"]
# Enable integration tests against a live arkd 2.7 instance.
# Requires ARKD_URL env var at test time.
# Usage: cargo test --features arkd-integration
arkd-integration = []

[lib]
name = "arkade_compiler"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
tempfile = "3.10.1"
assert_fs = "1.1.1"
predicates = "3.1.0"

[[bin]]
name = "arkadec"
path = "src/main.rs"
