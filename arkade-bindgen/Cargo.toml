[package]
name = "arkade-bindgen"
version.workspace = true
edition.workspace = true
description = "Multi-language SDK binding generator for Arkade contract artifacts"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
include = ["src/**/*.rs", "LICENSE"]

[dependencies]
arkade-compiler = { path = "..", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "arkade-bindgen"
path = "src/main.rs"

[lib]
name = "arkade_bindgen"
path = "src/lib.rs"
